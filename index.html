<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101323">
<title>Gokul Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#29345d 0,#151a30 38%,#0b0e19 100%);font-family:Inter,system-ui,Arial,sans-serif;color:#f7f8ff}.wrap{width:min(100%,390px)}.brand{font-size:12px;letter-spacing:3px;color:#9da9d8;text-align:center;margin:0 0 16px}.calc{padding:22px;border:1px solid #ffffff20;border-radius:28px;background:#171c31dd;box-shadow:0 25px 80px #0008;backdrop-filter:blur(16px)}.screen{min-height:116px;padding:14px 8px 22px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;overflow:hidden}.previous{min-height:24px;color:#9da8ca;font-size:16px;word-break:break-all}.current{font-size:clamp(34px,10vw,48px);font-weight:600;letter-spacing:-2px;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.key{border:0;border-radius:17px;min-height:66px;background:#252c46;color:#f5f6ff;font-size:22px;font-weight:600;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:inset 0 1px #ffffff12}.key:hover{filter:brightness(1.18)}.key:active{transform:scale(.95)}.muted{background:#343c59;color:#cbd3f4}.operator{background:#303b68;color:#aebeff}.equals{background:linear-gradient(135deg,#7c67ff,#4b8dff);color:white}.zero{grid-column:span 2}.foot{text-align:center;color:#7782a8;font-size:11px;margin:16px 0 0;letter-spacing:1px}@media(max-width:380px){.calc{padding:16px}.key{min-height:59px}}
</style>
</head>
<body>
<main class="wrap">
<p class="brand">GOKUL · CALCULATOR</p>
<section class="calc" aria-label="Calculator">
<div class="screen" aria-live="polite"><div class="previous" id="previous"></div><div class="current" id="display">0</div></div>
<div class="keys">
<button class="key muted" data-action="clear">AC</button><button class="key muted" data-action="delete">DEL</button><button class="key muted" data-action="percent">%</button><button class="key operator" data-op="÷">÷</button>
<button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key operator" data-op="×">×</button>
<button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key operator" data-op="−">−</button>
<button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key operator" data-op="+">+</button>
<button class="key zero" data-num="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals">=</button>
</div>
</section><p class="foot">SIMPLE · FAST · RESPONSIVE</p>
</main>
<script>
const display=document.getElementById('display'),previous=document.getElementById('previous');
let current='0',stored=null,operator=null,replace=false;
function render(){display.textContent=current;previous.textContent=stored!==null?stored+' '+(operator||''):''}
function number(n){if(replace){current=n;replace=false}else if(current==='0')current=n;else if(current.length<14)current+=n;render()}
function choose(op){if(operator&&stored!==null&&!replace)calculate();stored=current;operator=op;replace=true;render()}
function calculate(){if(stored===null||!operator)return;const a=Number(stored),b=Number(current);let result=operator==='+'?a+b:operator==='−'?a-b:operator==='×'?a*b:b===0?NaN:a/b;current=Number.isFinite(result)?String(Number(result.toPrecision(12))):'Error';stored=null;operator=null;replace=true;render()}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.num!==undefined)number(b.dataset.num);else if(b.dataset.op)choose(b.dataset.op);else switch(b.dataset.action){case'clear':current='0';stored=null;operator=null;replace=false;render();break;case'delete':current=current.length>1?current.slice(0,-1):'0';render();break;case'decimal':if(replace){current='0.';replace=false}else if(!current.includes('.'))current+='.';render();break;case'percent':current=String(Number(current)/100);render();break;case'equals':calculate();break;}});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))number(e.key);else if(e.key==='.')document.querySelector('[data-action="decimal"]').click();else if(e.key==='Enter'||e.key==='=')calculate();else if(e.key==='Backspace')document.querySelector('[data-action="delete"]').click();else if(e.key==='Escape')document.querySelector('[data-action="clear"]').click();else if(['+','-','*','/'].includes(e.key))choose(({'+':'+','-':'−','*':'×','/':'÷'})[e.key]);});
render();
</script>
</body></html>
